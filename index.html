<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de datos · Escuela Isabel Peña Morales</title>
<style>
:root{--ink:#16261c;--mut:#566a5c;--bg:#eef4ee;--card:#fff;--line:#c9d8cc;--pri:#007639;--btn:#fff;--acc:#f0b800;--err:#b3261e;--hd:#007639;--soft:rgba(240,184,0,.18);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ink:#e6f0e8;--mut:#a4b8aa;--bg:#0e1a13;--card:#16261c;--line:#2c4434;--pri:#5fd08b;--btn:#0e1a13;--err:#ff8a80;--hd:#00552a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--hd);color:#fff;border-bottom:6px solid var(--acc)}
header .in{max-width:760px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:14px}
header .tx{flex:1;text-align:center}
header p{margin:0;font-size:15px;opacity:.95}
h1{margin:2px 0 0;font-size:28px;line-height:1.15}
.lg{height:72px;width:60px;object-fit:contain;flex-shrink:0;background:#fff;border-radius:10px;padding:4px}
@media(max-width:480px){.lg{height:52px;width:44px}h1{font-size:21px}header p{font-size:13px}header .in{gap:8px;padding:12px 10px}}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.trk{height:6px;background:var(--line);border-radius:3px;margin:6px 0 18px}
#bar{height:100%;background:var(--pri);border-radius:3px;transition:width .25s}
h2{margin:0 0 6px;font-size:22px}
.note{background:var(--soft);border-left:4px solid var(--acc);padding:8px 12px;margin:0 0 16px;font-size:14px}
.hint{font-size:14px;color:var(--mut)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.w{grid-column:1/-1}
@media(max-width:600px){.g{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input[type=text],input[type=email],input[type=tel],input[type=date],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.opts label{display:inline-flex;gap:6px;align-items:center;font-weight:400;margin:0 14px 4px 0}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:0 0 14px}
input[type=checkbox]{width:18px;height:18px}
.e{color:var(--err);font-size:13px}
.foot{max-width:760px;margin:0 auto;padding:4px 16px 28px;text-align:center;font-size:13px;color:var(--mut)}
.bad input,.bad select{border-color:var(--err)}
.nav{display:flex;justify-content:space-between;margin-top:22px}
button{padding:11px 20px;border-radius:6px;border:1px solid var(--pri);font:inherit;font-weight:600;cursor:pointer;background:transparent;color:var(--pri)}
button.p{background:var(--pri);color:var(--btn);margin-left:auto}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
[hidden]{display:none!important}
</style>
</head>

["DIRECCIÓN","Dirección (ej. Calle #123, villa o población)","t",0,"qwa"],["COMUNA","Comuna","s",COM,"qO"]]},
{t:"Retiro y salud",r:"(Estudiante)",f:[
["NOMBRE Y APELLIDO DE LA PERSONA","Persona autorizada para retirarlo diariamente","t",0,"qw"],
["SI EN CASO DE HABER MÁS DE UNA PERSONA AUTORIZADA, SE","Segunda persona autorizada (si no hay, deje en blanco)","t",0,"wN"],
["NOMBRE Y APELLIDO DE LA AUTORIZADAS","Persona autorizada para retiro por fuerza mayor (gas, corte de agua u otros)","t",0,"qw"],
["SI EN CASO DE HABER MÁS DE UNA PERSONA AUTORIZADA PARA","Segunda persona para fuerza mayor (si no hay, deje en blanco)","t",0,"wN"],
["PREVISIÓN","Previsión de salud","s",PREV,"q"],["¿PADECE","¿Padece alguna enfermedad o condición?","s",SN,"q"],["EN CASO DE SI","¿Cuál?","t",0,"dw"],
["ESTÁ INTERVENIDO","¿Está intervenido por algún centro externo? ¿Cuál? (si no, deje en blanco)","t",0,"w"],
["PERTENECE AL PROGRAMA PIE","¿Pertenece al programa PIE?","s",SN,"q"],["PERTENECE AL PROGRAMA DE ALIMENTACIÓN","¿Pertenece al programa de alimentación PAE?","s",SN,"q"],
["¿ALERGICO?","¿Es alérgico/a?","s",SN,"q"],["SÍ RESPONDIÓ SI","¿A qué es alérgico/a?","t",0,"dw"]]},
{t:"Datos de la madre",r:"(Madre)",norun:1,sk:"No tengo datos de la madre",f:per},
{t:"Datos del padre",r:"(Padre)",norun:1,sk:"No tengo datos del padre",f:per},

const $=(t,p={},...c)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...c);return e};
const dv=b=>{let s=0,m=2;for(const c of[...b].reverse()){s+=c*m;m=m==7?2:m+1}const r=11-s%11;return r==11?"0":r==10?"K":""+r};
const fmt=v=>{const c=v.replace(/[.\-\s]/g,"").toUpperCase();if(!/^\d{6,9}[\dK]$/.test(c)||(c.length<10&&dv(c.slice(0,-1))!=c.slice(-1)))return null;return c.slice(0,-1).replace(/\B(?=(\d{3})+$)/g,".")+"-"+c.slice(-1)};
const rm=v=>{const c=v.replace(/[.\-\s]/g,"").toUpperCase();if(c.length<7)return"RUN incompleto";if(!/^\d{6,9}[\dK]$/.test(c))return"RUN inválido. Ejemplo: 12.345.678-9";if(c.length==10)return"";const b=c.slice(0,-1),d=dv(b);return d==c.slice(-1)?"":"El dígito verificador no coincide: para "+b.replace(/\B(?=(\d{3})+$)/g,".")+" debería ser "+d};
const app=document.getElementById("app"),bar=document.getElementById("bar"),lab=document.getElementById("lab"),nav=document.getElementById("nav");
document.getElementById("y").textContent=Y;
let cur=0;

function refresh(S){S.F.forEach(f=>{if(f.oth)f.oth.hidden=f.el.value!="Otra";if(f.dep)f.w.hidden=f.dep.get()!="Si"})}

const secs=D.map((d,i)=>{
 const box=$("section",{hidden:i>0}),F=[],S={d,box,F,skip:!!d.skd};
 box.append($("h2",{textContent:d.t}));
 if(i==0)box.append($("p",{className:"note",textContent:"Esta ficha reúne los datos del estudiante y de su familia para contacto y para actuar rápidamente en caso de emergencia. No es un proceso de matrícula y no requiere firma. Complétela con información actual y verídica."}));
 if(i==D.length-1)box.append($("p",{className:"hint",textContent:"Revise que los datos de contacto estén correctos antes de enviar."}));
 const body=$("div",{className:"g"});
 if(d.sk){const ck=$("input",{type:"checkbox",checked:S.skip});ck.onchange=()=>{S.skip=ck.checked;body.hidden=ck.checked};box.append($("label",{className:"chk"},ck," "+d.sk));body.hidden=S.skip}
 if(d.cp){const sel=$("select",{id:"cp"+i});sel.append(new Option("No, ingresaré otros datos","No"),new Option("Copiar los datos de la madre","Madre"),new Option("Copiar los datos del padre","Padre"),new Option("Copiar los datos del tutor","Tutor"));
  sel.onchange=()=>{const s=secs[{Madre:2,Padre:3,Tutor:4}[sel.value]];if(sel.value=="No")return;F.forEach(f=>{const g=s.F.find(x=>x.k==f.k);if(g){f.el.value=g.el.value;if(f.oth)f.oth.value=g.oth.value}});refresh(S)};
  S.cpSel=sel;body.append($("div",{className:"f w"},$("label",{htmlFor:sel.id,textContent:"Para simplificar el ingreso de datos"}),sel))}
 d.f.forEach(([k,l,t,o,fl=""])=>{
  const id="f"+i+"_"+F.length,w=$("div",{className:"f"+(fl.includes("w")||t=="k"?" w":"")}),f={k,t,fl,w,role:fl.includes("N")?"":d.r};
  let el,oth,nr;
  if(t=="k"){el=$("input",{id,type:"checkbox"});w.append($("label",{className:"chk",htmlFor:id},el," "+l+" *"))}
  else{
   w.append($("label",{htmlFor:id,textContent:l+(fl.includes("q")?" *":"")}));
   if(t=="s"){el=$("select",{id});el.append(new Option("Seleccione…",""),...o.map(x=>new Option(x,x)))}
   else if(t=="c"){el=$("div",{id,className:"opts"});o.forEach(x=>el.append($("label",{},$("input",{type:"checkbox",value:x})," "+x)))}
   else el=$("input",{id,type:t=="e"?"email":t=="n"?"tel":t=="d"?"date":"text",autocomplete:"off"});
   w.append(el);
   if(t=="run"){el.placeholder="12.345.678-9";if(d.norun){nr=$("input",{type:"checkbox"});nr.onchange=()=>{el.disabled=nr.checked;if(nr.checked){el.value="";w.classList.remove("bad");w.querySelector(".e").textContent=""}};w.append($("label",{className:"chk",style:"margin:6px 0 0"},nr," No poseo el RUN de esta persona"))}w.append($("div",{className:"hint",textContent:"Si es extranjero/a sin RUN chileno, escriba su IPA/IPE (ej. 200.123.456-7) o su pasaporte."}))}
   if(fl.includes("O")){oth=$("input",{type:"text",placeholder:"Especifique",hidden:true});oth.style.marginTop="6px";w.append(oth)}
  }
  w.append($("div",{className:"e"}));
  f.el=el;f.oth=oth;
  f.get=()=>t=="c"?[...el.querySelectorAll("input:checked")].map(x=>x.value).join(", "):t=="k"?(el.checked?"1":""):(oth&&el.value=="Otra"?oth.value.trim():el.value.trim());
  if(nr){const g0=f.get;f.get=()=>nr.checked?"No posee":g0()}
  if(fl.includes("d"))f.dep=F[F.length-1];
  if(t=="run"){
   el.oninput=()=>{const v=el.value,e=w.querySelector(".e");if(/^\s*[a-z]/i.test(v)){e.textContent="";return}
    const pos=el.selectionStart??v.length,before=v.slice(0,pos).replace(/[^0-9kK]/g,"").length;
    const c=v.replace(/[^0-9kK]/g,"").toUpperCase().replace(/K(?=[0-9K])/g,"").slice(0,10);
    const o=c.length>1?c.slice(0,-1).replace(/\B(?=(\d{3})+$)/g,".")+"-"+c.slice(-1):c;
    el.value=o;let i=o.length;if(before<c.length){let n=0;for(i=0;i<o.length&&n<before;i++)if(/[0-9K]/.test(o[i]))n++}
    try{el.setSelectionRange(i,i)}catch(x){}
    e.textContent="";
    if(e.textContent)w.classList.add("bad");else w.classList.remove("bad")};
   el.onblur=()=>{const v=el.value.trim(),e=w.querySelector(".e");if(!v||/^[a-z]/i.test(v))return;const r=fmt(v);if(r)el.value=r;const m=rm(v);e.textContent=m;w.classList.toggle("bad",!!m)}}
  F.push(f);body.append(w);
 });
 box.append(body);
 ["input","change"].forEach(ev=>box.addEventListener(ev,()=>refresh(S)));
 app.append(box);refresh(S);return S;
});

function check(S){
 if(S.skip)return true;let first;
 S.F.forEach(f=>{
  f.w.classList.remove("bad");const e=f.w.querySelector(".e");e.textContent="";if(f.w.hidden)return;
  const v=f.get();let m="";
  if(f.fl.includes("q")&&!v)m=f.t=="k"?"Debe aceptar para continuar":"Campo obligatorio";
  else if(v&&f.t=="run"&&!/^[a-z]/i.test(v)&&rm(v))m=rm(v);
  else if(v&&f.fl.includes("a")&&!/\d|(^|[\s,])s\/?n\b|sin n/i.test(v))m="Incluya el número (ej. Los Olivos 123). Si no tiene, escriba S/N";
  else if(v&&f.t=="e"&&!/^\S+@\S+\.\S+$/.test(v))m="Correo inválido";
  else if(v&&f.t=="n"&&!/^\d{8,11}$/.test(v.replace(/\D/g,"")))m="Teléfono inválido";
  if(m){e.textContent=m;f.w.classList.add("bad");first=first||f.el}
 });
 if(first){first.scrollIntoView({block:"center"});if(first.focus)first.focus();return false}
 return true;
}

const prev=$("button",{type:"button",textContent:"Anterior"}),next=$("button",{type:"button",className:"p"});
nav.append(prev,next);
function go(n){
 secs[cur].box.hidden=true;cur=n;secs[cur].box.hidden=false;
 prev.hidden=!cur;next.textContent=cur==D.length-1?"Enviar ficha":"Siguiente";
 lab.textContent=`Paso ${cur+1} de ${D.length}: ${D[cur].t}`;bar.style.width=(cur+1)/D.length*100+"%";scrollTo(0,0);
}
prev.onclick=()=>go(cur-1);
next.onclick=()=>{if(!check(secs[cur]))return;cur<D.length-1?go(cur+1):send()};

function done(){
 const n=secs[0].F[0].get();
 document.getElementById("m").replaceChildren($("div",{className:"card"},$("h2",{textContent:"Ficha recibida"}),
  $("p",{textContent:`Gracias. Registramos la ficha de datos de ${n}. La escuela utilizará esta información para contactarlos y para actuar en caso de emergencia. Si algún dato cambia (teléfono, dirección, personas autorizadas), avise al establecimiento.`}),
  $("button",{className:"p",textContent:"Completar otra ficha",onclick:()=>location.reload()})));
 scrollTo(0,0);
}
async function send(){
 const v={};
 secs.forEach(S=>{const off=S.skip;if(S.cpSel)v[`Para simplificar||'${S.d.cp}'`]=off?"":S.cpSel.value;S.F.forEach(f=>{if(f.k)v[f.k+"||"+f.role]=off||f.w.hidden?"":f.get()})});
 if(document.getElementById("web").value)return done();
 next.disabled=true;next.textContent="Enviando…";
 try{if(ENDPOINT)await fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify({v})});else console.log(v);done()}
 catch(e){next.disabled=false;next.textContent="Reintentar envío";alert("No se pudo enviar. Revise su conexión e intente nuevamente.")}
}
go(0);
</script>
